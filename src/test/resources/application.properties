# spring.config.import=file:src/main/resources/application.properties
spring.main.banner-mode=off
logging.level.org.springframework.jdbc=debug
logging.level.org.springframework.data.jdbc.repository.query=DEBUG

# Testcontainers will automatically provide the datasource configuration
# when using @ServiceConnection with PostgreSQLContainer
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# MyBatis configuration
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.org.example.aggrevateddata.PossibleObjectMapper=DEBUG
logging.level.org.mybatis=DEBUG
