spring.application.name=aggrevated-data
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase?currentSchema="$user",public
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:data.sql
# spring.jpa.show-sql=true (not needed for Spring Data JDBC)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.springframework.data.jdbc.repository.query=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
spring.thymeleaf.cache=false
mybatis.configuration.map-underscore-to-camel-case=true
# MyBatis logging to see SQL queries and parameter mapping
logging.level.org.example.aggrevateddata.PossibleObjectMapper=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.org.mybatis.spring=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
